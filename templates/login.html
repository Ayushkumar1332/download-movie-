<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head><body><main class="login-wrap"><form class="panel" method="post" action="/admin/login"><a class="logo" href="/">Cine<span>Vault</span></a><h1>Admin sign in</h1>{% if error %}<p class="error">{{ error }}</p>{% endif %}<label>Username<input name="username" required autocomplete="username"></label><label>Password<input name="password" type="password" required autocomplete="current-password"></label><button class="btn" type="submit">Sign in</button></form></main></body></html>
