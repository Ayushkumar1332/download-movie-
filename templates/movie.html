<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ movie.title }} · CineVault</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head><body><header class="nav"><a class="logo" href="/">Cine<span>Vault</span></a><a href="/">← Library</a></header><main class="detail">{% if movie.poster %}<img class="detail-poster" src="{{ url_for('poster', filename=movie.poster) }}" alt="Poster">{% endif %}<div><p class="eyebrow">{{ movie.category }}</p><h1>{{ movie.title }}</h1><p>{{ movie.description }}</p><p class="meta">{{ movie.year }} · {{ movie.language }} · {{ (movie.size/(1024*1024))|round(1) }} MB · {{ movie.downloads }} downloads</p><a class="btn" href="{{ url_for('download', movie_id=movie.id) }}">⬇ Download</a></div></main></body></html>
